version: "3.9"

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml  # Конфигурационный файл
      - prometheus_data:/prometheus  # Volume для данных
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'  # Указание конфигурационного файла
    ports:
      - "9090:9090"  # Проброс порта
    networks:
      - otus_highload
    depends_on:
      - otel-collector
      - zipkin-ui

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - grafana:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    ports:
      - "3020:3000"
    depends_on:
      - prometheus
    networks:
      - otus_highload

  zipkin-ui:
    container_name: zipkin-ui
    image: ghcr.io/openzipkin-contrib/zipkin-otel:0.2.0
    ports:
      - 9411:9411
    environment:
      UI_ENABLED: true
      OTEL_EXPORTER_OTLP_ENDPOINT: http://localhost:9411
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
    networks:
      - otus_highload

  otel-collector:
      container_name: otel-collector
      image: otel/opentelemetry-collector-contrib:0.123.0
      ports:
        - 4317:4317
        - 4318:4318
        - 55679:55679
      environment:
        UI_ENABLED: true
      networks:
        - otus_highload
      volumes:
        - ./otel-config.yaml:/etc/otelcol-contrib/config.yaml
#      extra_hosts:
#        - "host.docker.internal:host-gateway"

volumes:
  grafana:
    external: false
  prometheus_data:
    external: false


networks:
  otus_highload:
    driver: bridge