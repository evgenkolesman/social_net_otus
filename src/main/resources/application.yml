spring:
  application:
    name: socialnetotus
  flyway:
    #    baseline-on-migrate: true
    default-schema: ${db.schema}
    locations: "classpath:db/migrations"
  cache:
    type: caffeine
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: group_1

    producer:
      request:
        timeout:
          ms: 1000

  zipkin:
    base-url: http://localhost:9411
springdoc:
  api-docs:
    path: "/api-docs"
  swagger-ui:
    url: "/openapi.yml"
  show-actuator: true


db:
  schema:

rsa:
  private-key: classpath:private-key.pem
  public-key: classpath:public-key.pem
management:
  endpoint:
    health:
      show-details: always
    prometheus:
      access: read_only
#      exposure:

  metrics:
    export:
      otlp:
        enabled: true
        endpoint: http://localhost:4317
    distribution:
      percentiles-histogram:
        http:
          server:
            requests: true
    enable:
      jvm: true
      jdbc: true
      web: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
server:
  compression:
    enabled: true
    min-response-size: 2048

otel:
  traces:
    sampler: always_on
    exporter: zipkin
  exporter:
    otlp:
      endpoint: http://localhost:4317
  resource:
    attributes: "service.name=${spring.application.name}"
  metrics:
    exporter: none

#    attributes: service.name=${spring.application.name}

